<!doctype html>
<!-- ═══════════════════════════════════════════════════════════
     ESCOLA — o app de treino do Gilson.
     Pode mexer à vontade: nada aqui afeta o Caderno Pencil.

     O arquivo tem 3 partes, marcadas lá embaixo:
       PARTE 1 — APARÊNCIA .... cores e tamanhos
       PARTE 2 — TELA ......... o que aparece
       PARTE 3 — AÇÃO ......... o que acontece ao tocar
     ═══════════════════════════════════════════════════════════ -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escola</title>
<meta name="theme-color" content="#0b1220">
<script>
  /* encanamento do tema: põe o tema salvo antes de pintar (não pisca) */
  (function () {
    var t = null;
    try { t = localStorage.getItem('escola:tema'); } catch (e) {}
    if (t !== 'claro') t = 'escuro';
    document.documentElement.dataset.tema = t;
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t === 'claro' ? '#f4f6fb' : '#0b1220');
  })();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escola">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="icones/icone-180.png">

<style>
/* ═══ PARTE 1 — APARÊNCIA ═══════════════════════════════════ */

/* As cores moram em "variáveis" (os nomes com --).
   Tema Escuro, o de sempre: */
:root {
  color-scheme: dark;
  --fundo: #0b1220;         /* cor do fundo */
  --texto: #e8edf7;         /* cor do texto */
  --botao: #35d07f;         /* cor do botão */
  --botao-texto: #201400;   /* cor da letra do botão */
  --fraco: #93a1bd;         /* cor da contagem */
  --rodape: #7d8aa5;        /* cor do rodapé */
  --borda: #2b3a56;         /* contorno dos botões de tema */
}

/* Tema Claro: só troca as cores. */
:root[data-tema="claro"] {
  color-scheme: light;
  --fundo: #f4f6fb;
  --texto: #142033;
  --botao: #35d07f;
  --botao-texto: #201400;
  --fraco: #4a5873;
  --rodape: #5b6780;
  --borda: #c3cbdb;
}

body {
  background: var(--fundo);
  color: var(--texto);
  font-family: system-ui, -apple-system, sans-serif;
  text-align: center;
  padding: 40px 20px;
}

h1 {
  font-size: 34px;          /* tamanho do título */
  margin-bottom: 40px;
}

#botao {
  background: var(--botao);
  color: var(--botao-texto);
  font-size: 22px;          /* tamanho da letra do botão */
  font-weight: 600;
  border: 0;
  border-radius: 16px;
  padding: 20px 44px;       /* tamanho do botão */
  cursor: pointer;
}

#contagem {
  font-size: 20px;
  color: var(--fraco);
  margin-top: 30px;
}

.rodape {
  margin-top: 60px;
  font-size: 13px;
  color: var(--rodape);
}

/* seletor Tema: [Escuro] [Claro] */
.tema {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 40px;
  font-size: 15px;
  color: var(--fraco);
}
.tema button {
  min-height: 44px;
  padding: 8px 18px;
  border: 1px solid var(--borda);
  border-radius: 12px;
  background: transparent;
  color: var(--texto);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.tema button[aria-pressed="true"] {
  background: var(--botao);
  border-color: var(--botao);
  color: var(--botao-texto);
}
</style>
</head>

<body>

<!-- ═══ PARTE 2 — TELA ══════════════════════════════════════ -->

<h1>Oficina do Gilson</h1>

<button id="botao">PRONTO</button>

<p id="contagem">apertado 0 vezes</p>

<div class="tema" role="group" aria-label="Tema">
  <span>Tema:</span>
  <button type="button" data-tema-opcao="escuro" aria-pressed="true">Escuro</button>
  <button type="button" data-tema-opcao="claro" aria-pressed="false">Claro</button>
</div>

<p class="rodape">Escola <span data-versao>v1.1.0</span></p>

<script>
/* ═══ PARTE 3 — AÇÃO ═══════════════════════════════════════ */

const VERSAO = '1.1.0';   // precisa casar com a VERSAO do sw.js

let vezes = 0;                                    // começa no zero

document.getElementById('botao').onclick = () => {
  vezes = vezes + 1;                              // soma 1
  document.getElementById('contagem').textContent =
    'apertado ' + vezes + ' vezes';               // escreve na tela
};


/* troca de tema: Escuro / Claro (fica guardado no aparelho) */
function mostrarTema(tema) {
  document.documentElement.dataset.tema = tema;
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', tema === 'claro' ? '#f4f6fb' : '#0b1220');
  for (const b of document.querySelectorAll('[data-tema-opcao]')) {
    b.setAttribute('aria-pressed', String(b.dataset.temaOpcao === tema));
  }
}
for (const b of document.querySelectorAll('[data-tema-opcao]')) {
  b.onclick = () => {
    mostrarTema(b.dataset.temaOpcao);
    try { localStorage.setItem('escola:tema', b.dataset.temaOpcao); } catch (e) {}
  };
}
mostrarTema(document.documentElement.dataset.tema);


/* daqui para baixo é o encanamento: mostra a versão e faz o app
   abrir sem internet. Não precisa mexer. */
for (const lugar of document.querySelectorAll('[data-versao]')) {
  lugar.textContent = 'v' + VERSAO;
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
