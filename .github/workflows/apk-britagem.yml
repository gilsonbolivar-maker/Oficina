# Compila o APK do Britagem e publica em
# https://github.com/gilsonbolivar-maker/Oficina/releases/download/britagem-apk/britagem.apk
# O APK abre a página do site; só precisa recompilar quando o código Android muda.
name: APK do Britagem

on:
  push:
    branches: [main]
    paths:
      - 'britagem/android/**'
      - '.github/workflows/apk-britagem.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-britagem
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: britagem/android
        run: gradle --no-daemon assembleRelease

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp britagem/android/app/build/outputs/apk/release/app-release.apk britagem.apk
          gh release delete britagem-apk --yes --cleanup-tag || true
          gh release create britagem-apk britagem.apk \
            --title "Britagem para Android" \
            --notes "APK do Britagem: relatório de turno, com PDF e planilha salvos em Downloads. Compilado de ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
