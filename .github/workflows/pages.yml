# Publica a Oficina no GitHub Pages a cada push na main.
# A primeira execução liga o Pages sozinha (configure-pages com enablement),
# então não é preciso mexer em Settings.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Trava contra voltar no tempo: se alguém apertar "Re-run" numa publicação
      # antiga, ela pararia aqui em vez de trocar o site por uma versão velha.
      # Só publica se este commit for o mais novo da main.
      - name: Conferir se esta é a versão mais nova
        run: |
          novo=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$novo" != "$GITHUB_SHA" ]; then
            echo "::error::Publicação antiga (${GITHUB_SHA:0:7}). A versão mais nova é ${novo:0:7}. Nada foi publicado: o site continua como está."
            exit 1
          fi

      - name: Ligar o Pages, se ainda não estiver
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é o repositório inteiro: cada projeto fica na sua pasta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacao
        uses: actions/deploy-pages@v4
