# Compila o APK do Início (tela inicial para Android) e publica em
# https://github.com/gilsonbolivar-maker/Oficina/releases/download/inicio-apk/inicio.apk
# O APK abre a página do site; só precisa recompilar quando o código Android muda.
# Em outros branches só compila, para conferir; publica só da main.
name: APK do Início

on:
  push:
    paths:
      - 'inicio/android/**'
      - '.github/workflows/apk-inicio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-inicio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: inicio/android
        run: gradle --no-daemon assembleRelease

      - name: Publicar o APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp inicio/android/app/build/outputs/apk/release/app-release.apk inicio.apk
          gh release delete inicio-apk --yes --cleanup-tag || true
          gh release create inicio-apk inicio.apk \
            --title "Início para Android" \
            --notes "APK do Início 2: tela inicial roxa e dourada com mostrador (clima, bateria, notificações), abas, comando, gaveta e foco. Compilado de ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
