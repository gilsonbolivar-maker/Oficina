# Compila o APK do PixelMusic e publica em
# https://github.com/gilsonbolivar-maker/Oficina/releases/download/pixelmusic-apk/pixelmusic.apk
# O APK abre a página do site; só precisa recompilar quando o código Android muda.
name: APK do PixelMusic

on:
  push:
    branches: [main]
    paths:
      - 'pixelmusic/android/**'
      - '.github/workflows/apk-pixelmusic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-pixelmusic
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: pixelmusic/android
        run: gradle --no-daemon assembleRelease

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp pixelmusic/android/app/build/outputs/apk/release/app-release.apk pixelmusic.apk
          gh release delete pixelmusic-apk --yes --cleanup-tag || true
          gh release create pixelmusic-apk pixelmusic.apk \
            --title "PixelMusic para Android" \
            --notes "APK do PixelMusic: toca as músicas do celular, com equalizador e controles na notificação. Compilado de ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
