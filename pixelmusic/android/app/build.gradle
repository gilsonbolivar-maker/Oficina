plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.gilsonbolivar.pixelmusic'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.gilsonbolivar.pixelmusic'
        minSdk 24
        targetSdk 34
        // versionCode sobe a cada APK novo; versionName acompanha o app do site.
        versionCode 5
        versionName '1.2.3'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Chave fixa: o APK novo instala por cima do antigo sem desinstalar.
        oficina {
            storeFile file('../assinatura.jks')
            storePassword 'pixelmusic'
            keyAlias 'pixelmusic'
            keyPassword 'pixelmusic'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.oficina
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
