<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Chuva ao Vivo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0d1117;--card:rgba(13,17,23,.88);--txt:#e6edf3;--mut:#8b949e;--acc:#3fb5ff;--on:#1f6feb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #map{position:fixed;inset:0}
  .top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .chip{pointer-events:auto;border:1px solid #30363d;background:var(--card);color:var(--txt);padding:9px 12px;border-radius:20px;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
  .chip.on{background:var(--on);border-color:var(--on)}
  .chip small{display:block;font-size:11px;color:#c9d1d9;opacity:.85}
  .bottom{position:fixed;padding-bottom:18px!important;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:1000;background:var(--card);border:1px solid #30363d;border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
  .row{display:flex;align-items:center;gap:10px}
  .play{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#001018;font-size:20px;font-weight:700;cursor:pointer;flex:none}
  input[type=range]{flex:1;accent-color:var(--acc);height:30px}
  .hora{font-size:20px;font-weight:700;min-width:64px;text-align:right}
  .info{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
  .leg{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px;color:#c9d1d9}
  .bar{flex:1;height:10px;border-radius:5px}
  .gps{position:fixed;right:10px;bottom:calc(200px + env(safe-area-inset-bottom));z-index:1000;width:48px;height:48px;border-radius:50%;border:1px solid #30363d;background:var(--card);color:var(--txt);font-size:22px;cursor:pointer}
  .seta{display:flex;flex-direction:column;align-items:center;pointer-events:none}
  .seta svg{filter:drop-shadow(0 0 2px #000)}
  .seta b{font:600 10px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;margin-top:-2px}
  .perto{font-size:14px;margin-top:8px;line-height:1.4;color:#e6edf3}
  .perto b{color:#ffd166}
  .rosa{position:fixed;right:8px;bottom:calc(320px + env(safe-area-inset-bottom));z-index:1000;width:120px;text-align:center;pointer-events:none}
  .rosa svg{width:120px;height:120px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  .rosa div{font:600 12px system-ui;color:#fff;background:rgba(13,17,23,.8);border-radius:8px;padding:3px 6px;margin-top:2px;line-height:1.3}
  #agulha{transition:transform .6s ease}
  .leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.5)!important;color:#aaa}
  .leaflet-control-attribution a{color:#ccc}
  .leaflet-control-zoom{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <button class="chip on" id="bRadar">🌧️ Radar<small>chuva agora</small></button>
  <button class="chip on" id="bSat">🛰️ Satélite<small>nuvens, a cada 10 min</small></button>
  <button class="chip on" id="bVento">🧭 Vento<small>setas, km/h</small></button>
  <button class="chip" id="bImerg">💧 Chuva por satélite<small>estimativa NASA, atraso ~6 h</small></button>
</div>

<div class="rosa" id="rosa">
  <svg viewBox="-60 -60 120 120">
    <circle r="56" fill="rgba(13,17,23,.78)" stroke="#8b949e" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#30363d" stroke-width="1"/>
    <g fill="#c9d1d9">
      <polygon points="0,-38 5,-8 0,0 -5,-8"/><polygon points="38,0 8,5 0,0 8,-5"/>
      <polygon points="0,38 -5,8 0,0 5,8"/><polygon points="-38,0 -8,-5 0,0 -8,5"/>
    </g>
    <g fill="#6e7681" transform="rotate(45)">
      <polygon points="0,-28 4,-6 0,0 -4,-6"/><polygon points="28,0 6,4 0,0 6,-4"/>
      <polygon points="0,28 -4,6 0,0 4,6"/><polygon points="-28,0 -6,-4 0,0 -6,4"/>
    </g>
    <polygon points="0,-38 5,-8 0,0" fill="#ff5c5c"/>
    <g font-family="system-ui" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text y="-48" font-size="11" fill="#ff7b7b">N</text><text x="48" font-size="11" fill="#fff">L</text>
      <text y="48" font-size="11" fill="#fff">S</text><text x="-48" font-size="11" fill="#fff">O</text>
      <text x="34" y="-34" font-size="8" fill="#8b949e">NE</text><text x="34" y="34" font-size="8" fill="#8b949e">SE</text>
      <text x="-34" y="34" font-size="8" fill="#8b949e">SO</text><text x="-34" y="-34" font-size="8" fill="#8b949e">NO</text>
    </g>
    <g id="agulha" style="display:none">
      <line x1="0" y1="30" x2="0" y2="-30" stroke="#3fb5ff" stroke-width="5" stroke-linecap="round"/>
      <polygon points="0,-44 -10,-26 10,-26" fill="#3fb5ff" stroke="#001018" stroke-width="1"/>
    </g>
    <circle r="4" fill="#fff"/>
  </svg>
  <div id="rosaTxt">Vento: carregando…</div>
</div>
<button class="gps" id="bFundo" title="Mapa claro ou escuro" style="bottom:calc(260px + env(safe-area-inset-bottom))">🗺️</button>
<button class="gps" id="bGps" title="Minha localização">📍</button>

<div class="bottom">
  <div class="row">
    <button class="play" id="bPlay">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0">
    <div class="hora" id="hora">--:--</div>
  </div>
  <div class="leg" id="legRadar"><span>Radar:</span><span>fraca</span>
    <div class="bar" style="background:linear-gradient(90deg,#88ddee,#0099cc,#0077aa,#ffee00,#ffaa00,#ff4400,#c10000,#ff77ff)"></div><span>forte</span></div>
  <div class="leg" id="legSat"><span>Satélite:</span><span>céu limpo</span>
    <div class="bar" style="background:linear-gradient(90deg,#222,#999,#fff,#00c0ff,#00ff40,#ffff00,#ff3000)"></div><span>tempestade</span></div>
  <div class="perto" id="perto">☔ Toque em 📍 para ver a chuva mais perto de você.</div>
  <div class="info" id="info">Carregando dados…</div>
  <button id="bVersao" title="Toque para atualizar" style="position:absolute;right:6px;bottom:0;padding:6px 8px;border:0;background:none;color:#8b949e;font:500 11px ui-monospace,Menlo,monospace;cursor:pointer">⟳ <span data-versao></span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== Configuração =====
const SAT_LAG_MIN = 40;     // satélite GOES-East chega com ~30-40 min de atraso
const IMERG_LAG_MIN = 390;  // estimativa IMERG chega com ~6 h de atraso
const GIBS_WMS = 'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi';
const OP = {radar: 0.85, sat: 0.65, imerg: 0.8};

// ===== Mapa base =====
let inicio = [-14.5, -51], zoomIni = 4;
try { const s = JSON.parse(localStorage.getItem('chuva_view')); if (s) { inicio = s.c; zoomIni = s.z; } } catch(e){}
const map = L.map('map', {center: inicio, zoom: zoomIni, minZoom: 3, maxZoom: 12, worldCopyJump: true});
// Dois mapas de fundo: claro (OpenStreetMap, igual ao app OpenStreets) e escuro (Esri)
const fundos = {
  claro: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© colaboradores do <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}),
  escuro: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 16, attribution: 'Mapa: Esri, HERE, Garmin, © OpenStreetMap'})
};
let fundo = 'claro';
try { if (localStorage.getItem('chuva_fundo') === 'escuro') fundo = 'escuro'; } catch(e){}
fundos[fundo].addTo(map);
function trocarFundo() {
  map.removeLayer(fundos[fundo]);
  fundo = fundo === 'claro' ? 'escuro' : 'claro';
  fundos[fundo].addTo(map); fundos[fundo].bringToBack();
  try { localStorage.setItem('chuva_fundo', fundo); } catch(e){}
}
map.createPane('rotulos'); map.getPane('rotulos').style.zIndex = 650; map.getPane('rotulos').style.pointerEvents = 'none';
// nomes de cidades e fronteiras por cima de tudo (letra branca com contorno, lê bem sobre o satélite)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom: 16, pane: 'rotulos'}).addTo(map);
map.on('moveend', () => { try { localStorage.setItem('chuva_view', JSON.stringify({c: map.getCenter(), z: map.getZoom()})); } catch(e){} });
map.attributionControl.addAttribution('Radar: <a href="https://www.rainviewer.com/">Rain Viewer</a> · Satélite: NASA GIBS / NOAA GOES-East · IMERG: NASA GPM');

// Ordem das camadas: satélite embaixo, chuva IMERG no meio, radar em cima
map.createPane('pSat');   map.getPane('pSat').style.zIndex = 300;
map.createPane('pImerg'); map.getPane('pImerg').style.zIndex = 350;
map.createPane('pRadar'); map.getPane('pRadar').style.zIndex = 400;

// ===== Utilidades de tempo =====
const floorMin = (ms, m) => Math.floor(ms / (m * 60000)) * m * 60000;
const iso = ms => new Date(ms).toISOString().slice(0, 19) + 'Z';
const hhmm = ms => new Date(ms).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});

// ===== Estado =====
const ativo = {radar: true, sat: true, imerg: false};
const erros = {radar: 0, sat: 0, imerg: 0};
let frames = [];          // [{t, radarPath}]
let rvHost = '';
let idx = 0, timer = null;
const cache = {radar: new Map(), sat: new Map()};
let imergLayer = null, imergHora = '';

function gibsLayer(layerName, timeStr, pane, op) {
  const l = L.tileLayer.wms(GIBS_WMS, {
    layers: layerName, format: 'image/png', transparent: true, version: '1.1.1',
    TIME: timeStr, pane, opacity: op, maxZoom: 12
  });
  return l;
}

function camadaRadar(f) {
  if (!f.radarPath) return null;
  if (!cache.radar.has(f.radarPath)) {
    const l = L.tileLayer(rvHost + f.radarPath + '/256/{z}/{x}/{y}/2/1_1.png', {
      pane: 'pRadar', opacity: 0, maxNativeZoom: 7, maxZoom: 12
    });
    l.on('tileerror', () => { erros.radar++; });
    cache.radar.set(f.radarPath, l);
  }
  return cache.radar.get(f.radarPath);
}

function tempoSat(t) {
  const ultimo = floorMin(Date.now() - SAT_LAG_MIN * 60000, 10);
  return iso(Math.min(floorMin(t, 10), ultimo));
}

function camadaSat(t) {
  const ts = tempoSat(t);
  if (!cache.sat.has(ts)) {
    const l = gibsLayer('GOES-East_ABI_Band13_Clean_Infrared', ts, 'pSat', 0);
    l.on('tileerror', () => { erros.sat++; });
    cache.sat.set(ts, l);
  }
  return cache.sat.get(ts);
}

// Mostra um quadro: a camada do momento fica visível, as outras ficam escondidas (pré-carregadas)
function mostrar(i) {
  if (!frames.length) return;
  idx = (i + frames.length) % frames.length;
  const f = frames[idx];
  const rAtual = ativo.radar ? camadaRadar(f) : null;
  const sAtual = ativo.sat ? camadaSat(f.t) : null;

  cache.radar.forEach(l => { if (l !== rAtual) l.setOpacity(0); });
  cache.sat.forEach(l => { if (l !== sAtual) l.setOpacity(0); });
  if (rAtual) { if (!map.hasLayer(rAtual)) rAtual.addTo(map); rAtual.setOpacity(OP.radar); }
  if (sAtual) { if (!map.hasLayer(sAtual)) sAtual.addTo(map); sAtual.setOpacity(OP.sat); }

  // pré-carrega o próximo quadro
  const prox = frames[(idx + 1) % frames.length];
  if (ativo.radar) { const r = camadaRadar(prox); if (r && !map.hasLayer(r)) r.addTo(map); }
  if (ativo.sat)   { const s = camadaSat(prox.t); if (!map.hasLayer(s)) s.addTo(map); }

  document.getElementById('slider').value = idx;
  document.getElementById('hora').textContent = hhmm(f.t);
  atualizarInfo();
}

function atualizarInfo() {
  const f = frames[idx]; if (!f) return;
  const partes = [];
  const minAtras = Math.round((Date.now() - f.t) / 60000);
  partes.push(minAtras <= 5 ? 'Agora' : `Há ${minAtras} min`);
  if (ativo.radar) partes.push(f.radarPath ? 'radar ok' : 'radar indisponível');
  if (ativo.sat) partes.push('satélite ' + hhmm(Date.parse(tempoSat(f.t))));
  if (ativo.imerg) partes.push('chuva por satélite ' + imergHora);
  if (erros.radar > 20) partes.push('⚠ radar com falhas');
  if (erros.sat > 20) partes.push('⚠ satélite com falhas');
  document.getElementById('info').textContent = partes.join(' · ');
}

// ===== Chuva estimada por satélite (IMERG) — quadro mais recente =====
function ligarImerg(on) {
  if (on) {
    const t = floorMin(Date.now() - IMERG_LAG_MIN * 60000, 30);
    imergHora = hhmm(t);
    if (imergLayer) map.removeLayer(imergLayer);
    imergLayer = gibsLayer('IMERG_Precipitation_Rate', iso(t), 'pImerg', OP.imerg);
    imergLayer.on('tileerror', () => { erros.imerg++; });
    imergLayer.addTo(map);
  } else if (imergLayer) { map.removeLayer(imergLayer); imergLayer = null; }
  atualizarInfo();
}

// ===== Animação =====
function play() {
  const b = document.getElementById('bPlay');
  if (timer) { clearTimeout(timer); timer = null; b.textContent = '▶'; return; }
  b.textContent = '❚❚';
  const passo = () => {
    mostrar(idx + 1);
    timer = setTimeout(passo, idx === frames.length - 1 ? 2000 : 650);
  };
  passo();
}

// ===== Carregar lista de horários =====
async function carregar() {
  let radarFrames = [];
  try {
    const r = await fetch('https://api.rainviewer.com/public/weather-maps.json', {cache: 'no-store'});
    const j = await r.json();
    rvHost = j.host;
    radarFrames = (j.radar && j.radar.past) || [];
  } catch (e) { console.warn('Radar indisponível', e); }

  if (radarFrames.length) {
    frames = radarFrames.map(p => ({t: p.time * 1000, radarPath: p.path}));
  } else {
    // sem radar: linha do tempo só com satélite (últimas 2 h)
    const fim = floorMin(Date.now() - SAT_LAG_MIN * 60000, 10);
    frames = [];
    for (let k = 12; k >= 0; k--) frames.push({t: fim - k * 600000, radarPath: null});
  }
  // remove camadas de radar antigas que saíram da lista
  const validos = new Set(frames.map(f => f.radarPath));
  cache.radar.forEach((l, k) => { if (!validos.has(k)) { map.removeLayer(l); cache.radar.delete(k); } });
  if (cache.sat.size > 30) { cache.sat.forEach(l => map.removeLayer(l)); cache.sat.clear(); }

  const s = document.getElementById('slider');
  s.max = frames.length - 1;
  mostrar(frames.length - 1);   // sempre abre no quadro mais recente
}

// ===== Botões =====
function chip(id, chave, extra) {
  const b = document.getElementById(id);
  b.onclick = () => {
    ativo[chave] = !ativo[chave];
    b.classList.toggle('on', ativo[chave]);
    if (extra) extra(ativo[chave]);
    const leg = document.getElementById(chave === 'radar' ? 'legRadar' : 'legSat');
    if (chave !== 'imerg') leg.style.display = ativo[chave] ? 'flex' : 'none';
    if (!ativo.radar) cache.radar.forEach(l => l.setOpacity(0));
    if (!ativo.sat) cache.sat.forEach(l => l.setOpacity(0));
    mostrar(idx);
  };
}
chip('bRadar', 'radar');
chip('bSat', 'sat');
chip('bImerg', 'imerg', ligarImerg);
document.getElementById('bVento').onclick = e => {
  ventoOn = !ventoOn; e.currentTarget.classList.toggle('on', ventoOn);
  if (ventoOn) { ventoGrupo.addTo(map); desenharVento(true); } else map.removeLayer(ventoGrupo);
};

document.getElementById('bPlay').onclick = play;
document.getElementById('bFundo').onclick = trocarFundo;
// Toque no número da versão: baixa a página de novo, sem usar a cópia guardada no aparelho
document.getElementById('bVersao').onclick = async () => {
  document.getElementById('bVersao').textContent = 'Atualizando…';
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
  location.replace(location.pathname + '?atualizar=' + Date.now());
};
document.getElementById('slider').oninput = e => {
  if (timer) play();
  mostrar(+e.target.value);
};

let meuPonto = null, minhaPos = null;
document.getElementById('bGps').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meuPonto) map.removeLayer(meuPonto);
    meuPonto = L.circleMarker(ll, {radius: 8, color: '#fff', weight: 3, fillColor: '#3fb5ff', fillOpacity: 1, pane: 'rotulos'}).addTo(map);
    minhaPos = ll;
    map.setView(ll, 7);
    chuvaPerto(ll[0], ll[1]);
    atualizarRosa();
  }, () => { document.getElementById('info').textContent = 'Não consegui pegar sua localização (permissão negada).'; },
  {enableHighAccuracy: false, timeout: 10000});
};

// ===== Vento e chuva perto de você (Open-Meteo, modelo de previsão, atualiza a cada 15 min) =====
const OM = 'https://api.open-meteo.com/v1/forecast';
const RUMOS = ['norte','nordeste','leste','sudeste','sul','sudoeste','oeste','noroeste'];
const rumo = g => RUMOS[Math.round(((g % 360) + 360) % 360 / 45) % 8];
let ventoOn = true, ventoGrupo = L.layerGroup().addTo(map), ventoChave = '';

async function openMeteo(pontos, campos) {
  const lat = pontos.map(p => p[0].toFixed(3)).join(',');
  const lon = pontos.map(p => p[1].toFixed(3)).join(',');
  const r = await fetch(`${OM}?latitude=${lat}&longitude=${lon}&current=${campos}&wind_speed_unit=kmh&timezone=auto`);
  if (!r.ok) throw new Error('Open-Meteo ' + r.status);
  const j = await r.json();
  return Array.isArray(j) ? j : [j];
}

function corVento(v) { return v < 10 ? '#9be7ff' : v < 20 ? '#5ad1ff' : v < 35 ? '#ffe066' : v < 50 ? '#ff9f43' : '#ff4d4d'; }

function iconeSeta(dirDe, vel) {
  const para = (dirDe + 180) % 360;  // a seta aponta para onde o vento VAI
  const c = corVento(vel), t = vel < 10 ? 18 : vel < 25 ? 24 : 30;
  return L.divIcon({className: '', iconSize: [40, 44], iconAnchor: [20, 22], html:
    `<div class="seta"><svg width="${t}" height="${t}" viewBox="0 0 24 24" style="transform:rotate(${para}deg)">
      <path d="M12 2 L19 13 L14 12 L14 22 L10 22 L10 12 L5 13 Z" fill="${c}" stroke="#000" stroke-width="1"/></svg>
      <b>${Math.round(vel)}</b></div>`});
}

async function desenharVento(forcar) {
  if (!ventoOn) return;
  const b = map.getBounds(), z = map.getZoom();
  const chave = z + ':' + b.getCenter().lat.toFixed(1) + ':' + b.getCenter().lng.toFixed(1);
  if (!forcar && chave === ventoChave) return;
  ventoChave = chave;
  const cols = 6, lins = 8, pts = [];
  const n = b.getNorth(), s = b.getSouth(), w = b.getWest(), e = b.getEast();
  for (let i = 0; i < lins; i++) for (let k = 0; k < cols; k++)
    pts.push([n - (i + 0.5) * (n - s) / lins, w + (k + 0.5) * (e - w) / cols]);
  try {
    const dados = await openMeteo(pts.map(p => [Math.max(-85, Math.min(85, p[0])), ((p[1] + 540) % 360) - 180]), 'wind_speed_10m,wind_direction_10m');
    if (chave !== ventoChave) return;
    ventoGrupo.clearLayers();
    dados.forEach((d, i) => {
      if (!d.current) return;
      L.marker(pts[i], {icon: iconeSeta(d.current.wind_direction_10m, d.current.wind_speed_10m), interactive: false}).addTo(ventoGrupo);
    });
  } catch (e) { console.warn(e); }
}
// Rosa dos ventos: vento no seu ponto (se o 📍 foi usado) ou no centro do mapa
async function atualizarRosa() {
  const alvo = minhaPos || [map.getCenter().lat, map.getCenter().lng];
  try {
    const d = (await openMeteo([alvo], 'wind_speed_10m,wind_direction_10m,wind_gusts_10m'))[0].current;
    const ag = document.getElementById('agulha');
    ag.style.display = '';
    ag.setAttribute('transform', `rotate(${(d.wind_direction_10m + 180) % 360})`);
    ag.style.transform = '';
    document.getElementById('rosaTxt').innerHTML =
      `Vento do ${rumo(d.wind_direction_10m)}<br>${Math.round(d.wind_speed_10m)} km/h · rajada ${Math.round(d.wind_gusts_10m)}<br><span style="font-weight:400;opacity:.75">${minhaPos ? 'onde você está' : 'centro do mapa'}</span>`;
  } catch (e) { document.getElementById('rosaTxt').textContent = 'Vento indisponível'; }
}
let ventoTimer;
map.on('moveend', () => { clearTimeout(ventoTimer); ventoTimer = setTimeout(() => { desenharVento(false); if (!minhaPos) atualizarRosa(); }, 600); });

// ponto a "km" quilômetros na direção "graus" (0 = norte)
function destino(lat, lon, km, graus) {
  const R = 6371, d = km / R, b = graus * Math.PI / 180, f1 = lat * Math.PI / 180, l1 = lon * Math.PI / 180;
  const f2 = Math.asin(Math.sin(f1) * Math.cos(d) + Math.cos(f1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(f1), Math.cos(d) - Math.sin(f1) * Math.sin(f2));
  return [f2 * 180 / Math.PI, l2 * 180 / Math.PI];
}

function intensidade(mmh) {
  if (mmh < 2.5) return 'fraca'; if (mmh < 10) return 'moderada';
  if (mmh < 50) return 'forte'; return 'muito forte';
}

let linhaChuva = null;
async function chuvaPerto(lat, lon) {
  const el = document.getElementById('perto');
  el.textContent = '☔ Procurando chuva perto de você…';
  const DIST = [0, 5, 10, 20, 30, 45, 60, 80, 100, 130, 160, 200];
  const pts = [{km: 0, g: 0, p: [lat, lon]}];
  DIST.slice(1).forEach(km => { for (let g = 0; g < 360; g += 45) pts.push({km, g, p: destino(lat, lon, km, g)}); });
  try {
    const dados = await openMeteo(pts.map(x => x.p), 'precipitation,wind_speed_10m,wind_direction_10m');
    const aqui = dados[0].current;
    let melhor = null;
    dados.forEach((d, i) => {
      if (!d.current) return;
      const mmh = d.current.precipitation * 4;   // valor da Open-Meteo = mm nos últimos 15 min
      if (mmh >= 0.2) {
        const c = {...pts[i], mmh};
        if (!melhor || c.km < melhor.km || (c.km === melhor.km && c.mmh > melhor.mmh)) melhor = c;
      }
    });
    if (linhaChuva) { map.removeLayer(linhaChuva); linhaChuva = null; }
    const vento = `Vento aqui: ${Math.round(aqui.wind_speed_10m)} km/h vindo do ${rumo(aqui.wind_direction_10m)}.`;
    if (!melhor) {
      el.innerHTML = `☔ <b>Sem chuva em 200 km.</b> ${vento}`;
    } else if (melhor.km === 0) {
      el.innerHTML = `☔ <b>Chovendo onde você está</b>: ${intensidade(melhor.mmh)} (${melhor.mmh.toFixed(1)} mm/h). ${vento}`;
    } else {
      // a chuva vem na sua direção se ela está do lado de onde o vento sopra
      let dif = Math.abs(((melhor.g - aqui.wind_direction_10m) % 360 + 540) % 360 - 180);
      const vindo = aqui.wind_speed_10m >= 5 && dif <= 45;
      el.innerHTML = `☔ Chuva mais próxima: <b>${melhor.km} km ao ${rumo(melhor.g)}</b>, ${intensidade(melhor.mmh)} (${melhor.mmh.toFixed(1)} mm/h).` +
        (vindo ? ' <b>O vento empurra ela na sua direção.</b> ' : ' ') + vento;
      linhaChuva = L.layerGroup([
        L.polyline([[lat, lon], melhor.p], {color: '#ffd166', weight: 3, dashArray: '6 6', pane: 'rotulos'}),
        L.circleMarker(melhor.p, {radius: 10, color: '#ffd166', weight: 3, fillOpacity: 0, pane: 'rotulos'})
      ]).addTo(map);
    }
  } catch (e) {
    el.textContent = '☔ Não consegui consultar a chuva perto de você agora.';
    console.warn(e);
  }
}

// Atualiza sozinho a cada 5 minutos
carregar();

setInterval(() => {
  carregar();
  desenharVento(true);
  atualizarRosa();
  if (minhaPos) chuvaPerto(minhaPos[0], minhaPos[1]);
