<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Início</title>
<meta name="description" content="Tela inicial para Android com cara de Pixel Nexo: mostrador com clima e bateria, abas de fichário, barra de comando, gaveta e foco.">
<meta name="theme-color" content="#14042a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="icones/icone-180.png">
<script>
  // Tema escolhido (Nexo ou Grafite) aplicado antes de pintar, para não piscar.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('inicio:tema')); } catch (e) {}
    t = t === 'grafite' || t === 'grafite3d' ? t : 'nexo';
    document.documentElement.dataset.tema = t;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'nexo' ? '#14042a' : '#0e1418');
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Só aparece no tema 3D: luzes que flutuam e a grade em perspectiva. -->
  <div class="fundo-3d" aria-hidden="true"><i></i><i></i><b></b></div>
  <div class="tela">
    <!-- Mostrador, no estilo de relógio: hora, sol, foco, bateria, clima e bolhas -->
    <section class="mostrador" aria-label="Mostrador">
      <div class="linha-sol">
        <span id="nascer" class="tag"><b class="sol-n">◓</b> --:--</span>
        <span id="dia" class="dia"></span>
        <span id="por" class="tag">--:-- <b class="sol-p">◒</b></span>
      </div>
      <div class="centro">
        <button id="anel-foco" type="button" class="anel" aria-label="Foco de hoje">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="42"/><circle id="arco-foco" class="arco" cx="50" cy="50" r="42"/></svg>
          <span id="foco-min" class="anel-v">0<small>min</small></span><span id="foco-k" class="anel-k">foco</span>
        </button>
        <time class="relogio"><span id="hora">--:--</span><span id="segundos" class="seg">--</span></time>
        <div id="anel-bateria" class="anel" aria-label="Bateria">
          <svg id="tracos" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <span id="bat-v" class="anel-v">--<small>%</small></span><span id="bat-k" class="anel-k"></span>
        </div>
      </div>
      <button id="clima" type="button" class="clima">
        <span id="clima-agora" class="clima-agora">Toque para ver o clima</span>
        <span id="clima-colunas" class="clima-colunas" hidden></span>
      </button>
      <div id="bolhas" class="bolhas"><button id="chip-versao" type="button" class="chip-versao" aria-label="Procurar atualização"><span data-versao></span></button></div>
    </section>

    <aside id="aviso" class="aviso" hidden></aside>

    <button id="agora" type="button" class="agora">
      <span class="agora-rotulo">▸ Agora</span>
      <span id="agora-tarefa" class="agora-tarefa">Toque para escolher uma tarefa</span>
      <span id="agora-tempo" class="agora-tempo">25:00</span>
    </button>

    <nav id="abas" class="abas" aria-label="Abas do fichário"></nav>
    <main id="painel" class="painel">
      <div id="grade" class="grade"></div>
      <p id="vazio" class="vazio" hidden></p>
    </main>

    <div id="sugestoes" class="sugestoes" hidden></div>
    <form id="comando" class="comando" autocomplete="off">
      <button id="abrir-gaveta" type="button" class="botao-gaveta" aria-label="Todos os apps">⌃</button>
      <span class="prompt">nexo:~$</span>
      <input id="campo" type="search" placeholder="buscar app ou comando…" enterkeyhint="go" aria-label="Buscar app ou comando">
      <button type="submit" class="enviar" aria-label="Ir">→</button>
    </form>

    <nav id="barra" class="barra" aria-label="Barra fixa"></nav>
  </div>

  <!-- Gaveta: todos os apps de A a Z -->
  <section id="gaveta" class="gaveta" hidden>
    <header class="gaveta-topo">
      <span class="marca">Todos os apps <span id="contagem" class="contagem"></span></span>
      <button id="fechar-gaveta" type="button" class="fechar" aria-label="Fechar">⌄</button>
    </header>
    <input id="busca-gaveta" class="busca-gaveta" type="search" placeholder="Pesquisar aplicativos…" autocomplete="off" aria-label="Pesquisar aplicativos">
    <div id="lista-gaveta" class="lista-gaveta"></div>
  </section>

  <!-- Folha do foco: tarefa, passos e bloco -->
  <div id="folha-foco" class="fundo-folha" hidden>
    <section class="folha" role="dialog" aria-labelledby="titulo-foco">
      <p id="titulo-foco" class="rotulo">Agora estou fazendo</p>
      <input id="tarefa" class="tarefa" placeholder="Uma única tarefa…" autocomplete="off" aria-label="Tarefa de agora">
      <ul id="passos" class="passos"></ul>
      <form id="form-passo">
        <input id="novo-passo" class="novo-passo" placeholder="+ próximo passo pequeno" autocomplete="off" enterkeyhint="done" aria-label="Próximo passo">
      </form>
      <div class="bloco">
        <div>
          <p class="rotulo">Bloco de foco</p>
          <p id="tempo" class="tempo">25:00</p>
          <p id="bloco-estado" class="bloco-estado" hidden></p>
        </div>
        <div class="controles">
          <button id="bloco-comecar" type="button" class="botao-ouro">Começar</button>
          <div class="duracoes">
            <button type="button" data-min="15">15m</button>
            <button type="button" data-min="25">25m</button>
            <button type="button" data-min="45">45m</button>
          </div>
        </div>
      </div>
      <button type="button" class="fechar-folha" data-fecha>Fechar</button>
    </section>
  </div>

  <!-- Menu do toque longo -->
  <div id="menu" class="fundo-folha" hidden>
    <section class="folha" role="dialog" aria-labelledby="menu-nome">
      <p id="menu-nome" class="menu-nome"></p>
      <button id="menu-inicio" type="button" class="opcao"></button>
      <button id="menu-barra" type="button" class="opcao"></button>
      <p class="rotulo">Mostrar na aba</p>
      <div id="menu-abas" class="menu-abas"></div>
      <button id="menu-info" type="button" class="opcao">Informações do app</button>
      <button type="button" class="fechar-folha" data-fecha>Fechar</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
