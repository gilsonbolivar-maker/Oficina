plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.gilsonbolivar.inicio'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.gilsonbolivar.inicio'
        minSdk 26
        targetSdk 34
        // versionCode sobe a cada APK novo; versionName acompanha o app do site.
        versionCode 7
        versionName '2.5.0'
    }

    buildFeatures {
        buildConfig true
    }


    signingConfigs {
        // Chave fixa: o APK novo instala por cima do antigo sem desinstalar.
        oficina {
            storeFile file('../assinatura.jks')
            storePassword 'inicio'
            keyAlias 'inicio'
            keyPassword 'inicio'
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.oficina
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
