<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Player">
<meta name="theme-color" content="#141416">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Player</title>
<style>
:root{--fg:#f2f2f4;--mut:#a3a3ad;--acc:#3b82f6;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#141416;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hidden{display:none!important}

#bg{position:fixed;inset:-80px;background:#1c1c20 center/cover no-repeat;filter:blur(70px) brightness(.33) saturate(1.3);z-index:0;transition:background-image .8s}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(340px,46%) 1fr;padding-top:env(safe-area-inset-top)}

/* ---------- lado esquerdo ---------- */
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:4px;padding:14px 14px 8px}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ic:active{background:rgba(255,255,255,.1)}
.crumb{display:flex;flex-direction:column;min-width:0;padding-left:6px}
.crumb b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb>span{font-size:13px;color:var(--mut);margin-top:2px}
.ttl{display:flex;align-items:baseline;gap:8px;min-width:0}
.ver{font-size:12px;color:var(--mut);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:8px;flex:none}
.spacer{flex:1}
.search{padding:0 16px 8px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:var(--fg);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px calc(24px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:16px;padding:9px 8px;border-radius:12px}
.row:active{background:rgba(255,255,255,.06)}
.row.cur{background:rgba(255,255,255,.09)}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;font:600 26px Georgia,"Times New Roman",serif;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.thumb.folder{background:rgba(255,255,255,.1);color:#ffd27a}
.thumb.all{background:rgba(59,130,246,.22);color:#9cc2ff}
.meta{flex:1;min-width:0}
.t1{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--mut);font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playing{color:var(--fg);opacity:.8}
.more{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut);flex:none}
.more:active{background:rgba(255,255,255,.1)}
.empty{text-align:center;color:var(--mut);padding:60px 24px;line-height:1.5}
.empty .big{font-size:18px;color:var(--fg);font-weight:600;margin-bottom:8px}
.pill{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;font-size:16px}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}

/* ---------- player ---------- */
.player{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 48px calc(24px + env(safe-area-inset-bottom));min-height:0;min-width:0}
.cover{width:min(44vh,80%);aspect-ratio:1/1;border-radius:14px;overflow:hidden;display:grid;place-items:center;font:600 90px Georgia,serif;background:rgba(255,255,255,.06);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cover img{width:100%;height:100%;object-fit:cover}
.pinfo{text-align:center;margin-top:28px;max-width:100%;min-width:0}
.ptitle{font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist,.palbum{color:#8fb4ff;font-size:19px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(143,180,255,.5)}
.palbum{margin-top:6px}
.pbar{width:min(440px,100%);margin-top:40px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#e6e6ea;margin-top:-12px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.range::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
.range::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#e6e6ea;border:0}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:17px;margin-top:8px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:30px}
.cb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07)}
.cb:active{background:rgba(255,255,255,.16)}
.cb.flat{background:none;width:48px;height:48px;opacity:.45;position:relative}
.cb.flat.on{opacity:1}
.cb.flat .badge{position:absolute;top:6px;right:4px;font-size:11px;font-weight:700;background:var(--acc);border-radius:8px;padding:1px 4px}
.cb.play{width:82px;height:82px;background:rgba(255,255,255,.12)}
.vol{display:flex;align-items:center;gap:12px;width:min(440px,100%);margin-top:26px;color:var(--mut)}
.vol .range{flex:1}

/* ---------- retrato: player embaixo ---------- */
@media (orientation:portrait){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .left{border-right:0}
  .player{display:grid;grid-template-columns:120px 1fr;grid-template-areas:"c i" "b b" "k k" "v v";column-gap:20px;padding:18px 28px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.25);justify-items:stretch}
  .cover{grid-area:c;width:120px;font-size:44px;border-radius:10px}
  .pinfo{grid-area:i;text-align:left;margin-top:0;align-self:center}
  .ptitle{font-size:22px}.partist,.palbum{font-size:16px}
  .pbar{grid-area:b;width:100%;margin-top:14px}
  .ctrl{grid-area:k;margin-top:10px}
  .vol{grid-area:v;width:100%;margin-top:12px}
}

/* ---------- folha de opções ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);max-height:80vh;overflow-y:auto;background:#24242a;border-radius:18px;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h3{margin:10px 12px 6px;font-size:15px;color:var(--mut);font-weight:500;text-align:center}
.card button{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:12px;font-size:17px}
.card button:active{background:rgba(255,255,255,.08)}
.card button.danger{color:#ff6b6b}
.card button.cancel{text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d2d34;padding:12px 20px;border-radius:12px;font-size:15px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="bg"></div>
<div class="app">
  <section class="left">
    <header class="top">
      <button class="ic hidden" id="btnBack" aria-label="Voltar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="crumb"><div class="ttl"><b id="crumbTitle">Pastas</b><span class="ver" data-versao></span></div><span id="counter"></span></div>
      <div class="spacer"></div>
      <button class="ic" id="btnSearch" aria-label="Buscar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg></button>
      <button class="ic" id="btnAdd" aria-label="Adicionar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ic" id="btnMenu" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="19" r="2.1"/></svg></button>
    </header>
    <div class="search hidden" id="searchBox"><input id="q" type="search" placeholder="Buscar música ou artista" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </section>

  <section class="player">
    <div class="cover" id="cover"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.6"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
    <div class="pinfo">
      <div class="ptitle" id="pTitle">Nenhuma música</div>
      <div class="partist" id="pArtist"></div>
      <div class="palbum" id="pAlbum"></div>
    </div>
    <div class="pbar">
      <input type="range" class="range" id="seek" min="0" max="1000" value="0">
      <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
    </div>
    <div class="ctrl">
      <button class="cb flat" id="btnRepeat" aria-label="Repetir"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="badge hidden" id="rep1">1</span></button>
      <button class="cb" id="btnPrev" aria-label="Anterior"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="3" height="14" rx="1"/><path d="M20 5.5v13a1 1 0 0 1-1.5.86L8.5 13.2a1.4 1.4 0 0 1 0-2.4l10-6.16A1 1 0 0 1 20 5.5z"/></svg></button>
      <button class="cb play" id="btnPlay" aria-label="Tocar"><svg id="icPlay" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg><svg id="icPause" class="hidden" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg></button>
      <button class="cb" id="btnNext" aria-label="Próxima"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="17" y="5" width="3" height="14" rx="1"/><path d="M4 5.5v13a1 1 0 0 0 1.5.86l10-6.16a1.4 1.4 0 0 0 0-2.4l-10-6.16A1 1 0 0 0 4 5.5z"/></svg></button>
      <button class="cb flat" id="btnShuffle" aria-label="Aleatório"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
    </div>
    <div class="vol">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/></svg>
      <input type="range" class="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h3.5L11 5v14l-4.5-4H3z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
    </div>
  </section>
</div>

<input type="file" id="file" multiple class="hidden">
<div class="sheet hidden" id="sheet"><div class="card" id="card"></div></div>
<div id="toast"></div>
<audio id="audio" preload="auto" playsinline></audio>

<script src="app.js"></script>
</body>
</html>
