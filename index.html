<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina</title>
<meta name="description" content="Oficina de desenvolvimento — projetos e soluções.">
<meta name="theme-color" content="#0b1220">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    gap: 28px;
    padding: 32px;
    background: #0b1220;
    color: #e8edf7;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
  p { margin: 6px 0 0; color: #93a1bd; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a {
    display: block;
    max-width: 460px;
    padding: 18px 20px;
    border: 1px solid #2b3a56;
    border-radius: 14px;
    background: #141d2e;
    color: inherit;
    text-decoration: none;
  }
  a:hover { border-color: #ffb020; }
  b { font-size: 18px; }
</style>
</head>
<body>
  <header>
    <h1>Oficina</h1>
    <p>Projetos e soluções.</p>
  </header>
  <ul>
    <li>
      <a href="alarme-gps/">
        <b>Alarme GPS</b>
        <p>Toca um alarme quando você chega perto de um ponto marcado no mapa.</p>
      </a>
    </li>
    <li>
      <a href="tabela-de-ferias/">
        <b>Escala de Férias do Grupo A</b>
        <p>Três períodos por colega, com o quadro do mês e as folgas da escala de turnos.</p>
      </a>
    </li>
  </ul>
</body>
</html>
